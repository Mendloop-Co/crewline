# crewline settings for this repository. Every crewline skill reads this file first.
# Copy to .claude/crewline.yml in your repository and replace every <...> value. Lines marked "team model only" stay
# out until team_model is true (the setup skill, "Turning on the team model").

repo: <owner>/<name>                 # the GitHub repository
work_branch: develop                 # every slice branches from and targets this branch
production_branch: main              # changes only through a PR a human merges; agents never merge it
owner: <name>                        # the human who makes product and scope decisions
owner_accounts: []                   # the owner's own GitHub accounts, or []; the watcher routes their posts first.
                                     # Only logins agents never post from; a shared login goes in shared_accounts only

home_team: <team>                    # your own crew's label: for:<team>
team_model: false                    # false: one small crew (a coordinator, its agents, the board). true: managers,
                                     # titled sessions and registry files (docs.teams); turn it on when another team or
                                     # account joins (setup skill, "Turning on the team model")
shared_accounts: [<github-login>]    # GitHub accounts your own agents post from; watchers ignore their signed posts
agent_names: ["Agent {N}"]           # how your own agents sign; {N} is any number. List the coordinator's and any other
                                     # name without a number too, e.g. ["Agent {N}", "Lead"]. A post is signed when its
                                     # first line starts "<name>:", or its last line is "— <name>, <team>".
                                     # With the team model: cover every "Signs as" in the HOME team's registry file,
                                     # and keep shared_accounts equal to its Agent accounts (never an outside team's)
usage_stop: weekly 90%               # the crew's hard usage stop: the coordinator stops the crew before it (with the
                                     # team model, each team's registry row holds its own)
# index_issue: <number>              # team model only: the pinned "start here" index issue for outside teams

coordinator:
  name: <e.g. Lead>                  # the agent that runs the merge gate
  session: <chat or session name>    # the coordinator's chat; with the team model it is "<home_team> · Manager"

docs:                                # one home per topic; every other file links here
  rules: CLAUDE.md                   # the rulebook every agent loads automatically
  contributing: CONTRIBUTING.md      # branches, claims, the merge gate, collaboration
  # Team model only (uncomment when you turn it on). Folder paths end in "/".
  # teams: TEAMS.md                  # roles, session titles, chain of command, context and usage limits
  # teams_dir: teams/                # one registry file per team: <team>.md, plus _template.md for new teams
  # roles_dir: teams/roles/          # one file per role: manager.md, dev.md
  definition_of_done: docs/DONE.md#done # the one definition of done; #section is the heading's anchor, e.g. docs/DONE.md#done
  board: docs/BOARD.md               # lanes, queues, priorities (your own crew only)
  decisions: docs/DECISIONS.md       # append-only decisions log
  areas: docs/AREAS.md               # "path-prefix area" per line; longest prefix wins
  status_dir: docs/status/           # one status file per area
  specs: docs/specs/                 # plans and specs, one file per topic, approved before code

planner:                             # optional, delete if unused: the agent that turns ideas into plans (planner skill)
  session: <chat or session name>    # the owner's approvals are read here
  owner_language: English            # the language it talks to the owner in
  side_plans: <folder>               # optional: plans that need no code (business, operations); unset = in the chat

merge_gate:                          # examples; adapt both lists to your project
  high_risk: [auth, permissions, personal data, money, multi-tenant data, schema migrations, deploy config]
  self_merge_ok: [docs, pure UI or copy, chores]
  reviewer_model: opus               # the independent second reviewer for high-risk diffs
  max_review_cycles: 2               # a third only after a P0/P1

watcher:
  active_seconds: 900                # manual tick: after an outside post in the last hour
  quiet_seconds: 3600                # manual tick: otherwise
  ack_hours: 2                       # a for:<team> issue without "Seen" after this = that team's watcher is down
  poll_seconds: 60                   # the script: seconds between passes (30 at least)
  update_minutes: 15                 # the script: pull a clean clone and re-read this file this often
  owner_labels: [needs:owner, owner:do]  # an unsigned post from shared_accounts here is the owner's
  # alert_label: alert               # optional: issues with this label are live incidents, routed first

agents:                              # optional, delete if unused: your crew's agents on one machine (add-agent skill)
  root: <folder that holds each agent's working copy>
  # Optional, only if agents run local servers or databases side by side. "800{N}" appends the number
  # (agent 3: 8003); "5173+{N}" adds it (agent 3: 5176). Examples:
  # db_port_pattern: "5433{N}"
  # api_port_pattern: "800{N}"
  # web_port_pattern: "5173+{N}"
